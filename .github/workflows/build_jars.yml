name: Build Jars

on:
  push:
    branches-ignore: [ 'master' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout 🛎️'
        uses: actions/checkout@v5
      - name: 'Set up JDK 21 📦'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: 'Set up Gradle 🐘'
        uses: gradle/actions/setup-gradle@v4
      - name: 'Build Paper & Spigot jars 🏗️'
        run: ./gradlew :paper:shadowJar :bukkit:shadowJar --no-daemon
      - name: 'Upload jars 📤'
        uses: actions/upload-artifact@v4
        with:
          name: HuskClaims-jars
          path: |
            target/HuskClaims-Paper-*.jar
            target/HuskClaims-Bukkit-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error
      - name: 'Check Paper jar links against Adventure 5 (Paper 26.x) 🔗'
        continue-on-error: true
        run: |
          mkdir -p adventure5
          for a in adventure-api adventure-key adventure-text-serializer-legacy adventure-text-serializer-plain \
              adventure-text-serializer-gson adventure-text-serializer-json adventure-text-minimessage \
              adventure-text-logger-slf4j; do
            curl -sSfL -o "adventure5/$a.jar" "https://repo1.maven.org/maven2/net/kyori/$a/5.2.0/$a-5.2.0.jar" \
              || { echo "Could not download $a"; rm -f "adventure5/$a.jar"; }
          done
          jar=$(ls target/HuskClaims-Paper-*.jar | grep -v -e '-sources' -e '-javadoc' | head -n 1)
          java .github/scripts/AdventureLinkageCheck.java "$jar" adventure5/*.jar
